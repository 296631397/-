      - name: Build extension
        run: |
          xcodebuild \
            -project RedCalendarWidget.xcodeproj \
            -target RedCalendarWidgetExtension \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Collect .appex
        run: |
          mkdir -p out
          echo "--- build tree ---"
          find build -maxdepth 3 -name "*.appex" -print
          APPEX=$(find build -maxdepth 3 -name "RedCalendarWidgetExtension.appex" -print -quit)
          if [ -z "$APPEX" ]; then echo "未找到 appex"; exit 1; fi
          cp -R "$APPEX" out/
          ls -la out/
