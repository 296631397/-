name: RedCalendarWidget
options:
  bundleIdPrefix: cn.etouch.ecalendar.ipad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  RedCalendarWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.etouch.ecalendar.ipad.RedCalendarWidgetExtension
      PRODUCT_NAME: RedCalendarWidgetExtension
      INFOPLIST_FILE: Sources/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
